name: Keep Supabase Alive

# 每天 UTC 03:17 自动执行一次真实数据库写操作（INSERT），防止免费项目因7天不活跃被暂停
# 为什么是 INSERT 而不是 SELECT：Supabase 的不活跃检测基于数据库活动，
#   SELECT 可能命中缓存不计入；INSERT 是无法被缓存绕过的真实写事务（2026-08-21 升级）
# 也支持手动触发（Actions 面板 → Keep Supabase Alive → Run workflow）
on:
  schedule:
    - cron: '17 3 * * *'  # 每天 UTC 03:17（避开整点高峰，北京时间上午11:17）
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: INSERT heartbeat + cleanup (prevent auto-pause)
        run: |
          set -euo pipefail

          SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}"
          SUPABASE_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}"

          # 校验 secrets 已配置
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::GitHub Secrets 未配置 VITE_SUPABASE_URL 或 VITE_SUPABASE_ANON_KEY"
            echo "请在 GitHub 仓库 Settings → Secrets and variables → Actions → 添加这两个 Secret"
            exit 1
          fi

          # 去掉 URL 末尾的斜杠，避免出现双斜杠 /rest/...
          SUPA_URL="${SUPABASE_URL%/}"

          # 1) INSERT 一条心跳记录 — 真实数据库写操作，可靠重置不活跃计时器
          echo "→ INSERT heartbeat into keep_alive_pings ..."
          INSERT_CODE=$(curl -w "%{http_code}" \
            --max-time 30 \
            --retry 2 \
            -X POST \
            "${SUPA_URL}/rest/v1/keep_alive_pings" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"source":"github-actions"}' \
            -o /dev/null)

          if [ "$INSERT_CODE" != "201" ]; then
            echo "::error::心跳 INSERT 失败 HTTP ${INSERT_CODE}"
            echo "请确认 keep_alive_pings 表已创建：Supabase Dashboard → SQL Editor → 执行 database/migration-v5-keepalive.sql"
            exit 1
          fi
          echo "✅ INSERT OK (HTTP 201) — 不活跃计时器已重置"

          # 2) 清理 30 天前的旧心跳，防止表无限增长
          CUTOFF=$(date -u -d "30 days ago" +%Y-%m-%d)
          echo "→ Cleaning heartbeats older than ${CUTOFF} ..."
          DELETE_CODE=$(curl -w "%{http_code}" \
            --max-time 30 \
            --retry 2 \
            -X DELETE \
            "${SUPA_URL}/rest/v1/keep_alive_pings?pinged_at=lt.${CUTOFF}" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -o /dev/null)

          echo "✅ Cleanup done (HTTP ${DELETE_CODE})"
