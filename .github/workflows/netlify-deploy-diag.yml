# Netlify 部署诊断（临时，2026-08-21）：把诊断结果写回仓库 netlify-diag.txt，便于无登录读取
name: Netlify Deploy Diag
on:
  push:
    paths:
      - '.github/workflows/netlify-deploy-diag.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Netlify state + deploys + direct deploy test
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set +e
          {
            echo '=== 1. 当前站点配置 build_settings ==='
            curl -s -w "\nHTTP:%{http_code}\n" -H "Authorization: Bearer ${NETLIFY_TOKEN}" "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE}" | jq '{name, url, build_settings}' 2>/dev/null || curl -s -w "\nHTTP:%{http_code}\n" -H "Authorization: Bearer ${NETLIFY_TOKEN}" "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE}"
            echo ''
            echo '=== 2. 最近 5 次部署记录（含 error_message） ==='
            curl -s -w "\nHTTP:%{http_code}\n" -H "Authorization: Bearer ${NETLIFY_TOKEN}" "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE}/deploys?per_page=5"
            echo ''
            echo '=== 3. 直连 Deploy API 测试（POST zip，观察响应码） ==='
            printf 'diag-test' > /tmp/diag.zip
            curl -s -w "\nHTTP:%{http_code}\n" -X POST -H "Authorization: Bearer ${NETLIFY_TOKEN}" -H "Content-Type: application/zip" --data-binary '@/tmp/diag.zip' "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE}/deploys"
          } > netlify-diag.txt 2>&1
          git config user.name 'diag-bot'
          git config user.email 'diag-bot@users.noreply.github.com'
          git add netlify-diag.txt
          git commit -m 'diag: netlify deploy diagnostics' || echo 'nothing to commit'
          git push origin master || echo 'PUSH_BACK_FAILED'