# Netlify 自动修复 v3（2026-08-21）
# 诊断结论（netlify-deploy-diag 实测）：
#   - 部署被拒的真实原因：账号积分超限（Account credit usage exceeded，HTTP 403），
#     与 stop_builds 无关——Netlify 在积分用尽时封禁所有新部署（含 API 上传），8/25 重置后自动恢复
#   - 积分超限的元凶：Netlify 连了 GitHub 自动构建（provider=github + build 命令），每次 push 双倍构建
#   - 手动模式（provider=manual）无法通过 API 的部分 PUT 生效，故采用已验证可靠的 stop_builds=true
# 本工作流：
#   1. 读取站点 build_settings
#   2. 若非停止状态 → 设 stop_builds=true（等效 UI 的 Stop builds，已验证生效且不阻止 API 部署）
#   3. 把前后配置写回仓库 netlify-autofix-report.txt（便于无登录核验）
# 触发：本文件变更自动运行一次；也可 Actions → Netlify Auto-Fix → Run workflow
name: Netlify Auto-Fix (stop auto-build)
on:
  push:
    paths:
      - '.github/workflows/netlify-autofix.yml'
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Stop Netlify auto-builds + report back
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          {
            echo '=== BEFORE ==='
            curl -sf --max-time 30 -H "Authorization: Bearer ${NETLIFY_TOKEN}" "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE}" | jq '.build_settings | {provider, repo_url, stop_builds, cmd, base}'
            echo ''
            echo '=== APPLY stop_builds=true ==='
            curl -sf --max-time 30 -X PUT -H "Authorization: Bearer ${NETLIFY_TOKEN}" -H "Content-Type: application/json" \
              -d '{"build_settings":{"stop_builds":true}}' \
              "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE}" > /dev/null && echo 'PUT OK'
            echo ''
            echo '=== AFTER ==='
            curl -sf --max-time 30 -H "Authorization: Bearer ${NETLIFY_TOKEN}" "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE}" | jq '.build_settings | {provider, repo_url, stop_builds, cmd, base}'
          } > netlify-autofix-report.txt 2>&1
          git config user.name 'autofix-bot'
          git config user.email 'autofix-bot@users.noreply.github.com'
          git add netlify-autofix-report.txt
          git commit -m 'autofix: netlify stop_builds report' || echo 'nothing to commit'
          git push origin master || echo 'PUSH_BACK_FAILED'