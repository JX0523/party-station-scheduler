# 一次性系统审计（2026-09-24）：在 GitHub 服务器上访问 Supabase，跑真实数据体检 + 真实算法模拟
# 触发：本文件或审计脚本变更时；也可 Actions → Run workflow。用完即删。
name: System Audit (one-shot)
on:
  push:
    paths:
      - '.github/workflows/system-audit.yml'
      - 'tools/system-audit.mjs'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run system audit
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node tools/system-audit.mjs audit-report.md
      - name: Show report in job summary
        if: always()
        run: cat audit-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Commit report back
        if: always()
        run: |
          git config user.name 'audit-bot'
          git config user.email 'audit-bot@users.noreply.github.com'
          git add audit-report.md
          git commit -m 'audit: system report' || echo 'nothing to commit'
          git push origin master || echo 'PUSH_BACK_FAILED'