# 持续集成：每次推送/PR 自动跑测试、构建、代码检查（无需任何密钥）
name: CI
on:
  push:            # 所有分支（含 master）：每次提交都跑测试与构建
  pull_request:    # 任何 PR 都会跑，作为合并前的质量门禁
  workflow_dispatch:
jobs:
  test:
    name: 测试 / 构建 / 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 运行全部测试
        run: |
          total=0; failed=0
          for f in test-*.mjs; do
            echo "━━━━━━ $f ━━━━━━"
            out=$(node "$f" 2>&1); code=$?
            echo "$out" | tail -4
            if [ $code -ne 0 ]; then
              echo "::error file=$f::$f 执行失败（退出码 $code）"
              failed=$((failed + 1)); continue
            fi
            summary=$(echo "$out" | grep -oE '[0-9]+/[0-9]+ 通过' | tail -1)
            if [ -z "$summary" ]; then
              echo "::error file=$f::未找到测试汇总输出"
              failed=$((failed + 1)); continue
            fi
            pass=${summary%%/*}
            all=$(echo "$summary" | cut -d/ -f2 | cut -d' ' -f1)
            if [ "$pass" != "$all" ]; then
              echo "::error file=$f::$pass/$all 通过，存在失败用例"
              failed=$((failed + 1)); continue
            fi
            total=$((total + all))
          done
          echo ""
          if [ $failed -ne 0 ]; then
            echo "❌ 有 $failed 个测试套件失败"
            exit 1
          fi
          echo "✅ 全部测试通过，共 $total 项"

      - name: 准备环境变量（CI 使用占位值；真实值由 deploy.yml 从 Secrets 注入）
        run: |
          if [ ! -f frontend/.env ]; then
            echo 'VITE_SUPABASE_URL=https://demo-project.supabase.co' > frontend/.env
            echo 'VITE_SUPABASE_ANON_KEY=demo-anon-key-for-ci' >> frontend/.env
          fi

      - name: 生产构建
        working-directory: frontend
        run: npm run build

      - name: 运行时冒烟测试（真实加载构建产物，逐页渲染）
        run: node test-runtime-smoke.mjs

      - name: 代码检查（必须 0 error）
        working-directory: frontend
        run: npm run lint

      - name: 依赖安全审计（仅报告，不阻塞）
        working-directory: frontend
        continue-on-error: true
        run: npm audit --omit=dev || true