# 持续集成：每次推送/PR 自动跑测试、构建、代码检查（无需任何密钥）
name: CI
on:
  push:
    branches: [master]      # 只在主线跑（分支/临时实验不打扰）
    paths-ignore:           # 只改文档时不跑
      - '**/*.md'
      - 'docs/**'
      - 'dev-logs/**'
      - '.gitignore'
  pull_request:             # 合并前的质量门禁
  workflow_dispatch:
jobs:
  test:
    name: 测试 / 构建 / 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # jsdom 30（运行时冒烟测试）需要 Node 22+

      - name: 环境信息（便于排查）
        run: |
          node --version
          npm --version
          echo "runner: $RUNNER_OS / $RUNNER_ARCH"
        shell: bash

      - name: 安装依赖
        working-directory: frontend
        shell: bash
        run: |
          npm ci --no-audit --no-fund || {
            echo "::warning::npm ci 失败，回退到 npm install 继续验证代码"
            npm install --no-audit --no-fund
          }

      - name: 运行全部测试
        shell: bash
        run: |
          # 关键：关闭 errexit，否则第一个失败套件会让整个步骤静默退出，看不到是哪一套挂了
          set +e
          total=0; failed=0; skipped=0
          for f in test-*.mjs; do
            echo "━━━━━━ $f ━━━━━━"
            out=$(node "$f" 2>&1); code=$?
            echo "$out" | tail -6
            if [ $code -ne 0 ]; then
              echo "::error file=$f::$f 执行失败（退出码 $code）"
              failed=$((failed + 1)); continue
            fi
            summary=$(echo "$out" | grep -oE '[0-9]+/[0-9]+ 通过' | tail -1)
            if [ -z "$summary" ]; then
              # 退出码为 0 但没有汇总 = 该套件主动跳过（例如未构建/未装依赖时的冒烟与 xlsx 测试）
              echo "  ⏭️  $f 已跳过（依赖或构建产物缺失，属预期行为）"
              skipped=$((skipped + 1)); continue
            fi
            pass=${summary%%/*}
            all=$(echo "$summary" | cut -d/ -f2 | cut -d' ' -f1)
            if [ "$pass" != "$all" ]; then
              echo "::error file=$f::$pass/$all 通过，存在失败用例"
              failed=$((failed + 1)); continue
            fi
            total=$((total + all))
          done
          echo ""
          if [ $failed -ne 0 ]; then
            echo "❌ 有 $failed 个测试套件失败"
            exit 1
          fi
          echo "✅ 测试通过，共 $total 项；跳过 $skipped 个套件"
          if [ $skipped -gt 0 ]; then
            echo "（跳过的套件会在后续「生产构建」与「运行时冒烟测试」步骤中被真正执行）"
          fi

      - name: 准备环境变量（CI 使用占位值；真实值由 deploy.yml 从 Secrets 注入）
        run: |
          if [ ! -f frontend/.env ]; then
            echo 'VITE_SUPABASE_URL=https://demo-project.supabase.co' > frontend/.env
            echo 'VITE_SUPABASE_ANON_KEY=demo-anon-key-for-ci' >> frontend/.env
          fi

      - name: 生产构建
        working-directory: frontend
        run: npm run build

      - name: 运行时冒烟测试（真实加载构建产物，逐页渲染 + 分享页）
        shell: bash
        run: |
          node test-runtime-smoke.mjs
          if [ -f test-share-route.mjs ]; then node test-share-route.mjs; fi
          if [ -f test-scheduling-ui.mjs ]; then node test-scheduling-ui.mjs; fi
          if [ -f test-holiday-ui.mjs ]; then node test-holiday-ui.mjs; fi
          if [ -f test-members-ui.mjs ]; then node test-members-ui.mjs; fi
          if [ -f test-course-ui.mjs ]; then node test-course-ui.mjs; fi

      - name: 代码检查（必须 0 error）
        working-directory: frontend
        run: npm run lint

      - name: 依赖安全审计（仅报告，不阻塞）
        working-directory: frontend
        continue-on-error: true
        run: npm audit --omit=dev || true